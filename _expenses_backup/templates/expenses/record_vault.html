{% extends 'base.html' %}

{% block title %}Reference Record Vault - Expense Manager{% endblock %}

{% block content %}
<!-- Tailwind CSS for the Vault UI -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
    /* Scope styles to avoid clashing with Bootstrap */
    #vault-app-container {
        font-family: 'Inter', sans-serif;
    }

    .nav-item.active {
        background: #eff6ff;
        color: #2563eb;
        border-right: 3px solid #2563eb
    }

    .fade-in {
        animation: fadeIn .3s ease-in-out
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(5px)
        }

        to {
            opacity: 1;
            transform: translateY(0)
        }
    }

    #toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px
    }

    .toast {
        background: #fff;
        border-left: 4px solid #2563eb;
        padding: 16px;
        box-shadow: 0 4px 6px #0000001a;
        transform: translateX(100%);
        transition: .3s;
        display: flex;
        align-items: center;
        min-width: 300px
    }

    .toast.show {
        transform: translateX(0)
    }

    .toast.error {
        border-color: #dc2626
    }

    .toast.success {
        border-color: #16a34a
    }
</style>

<div id="vault-app-container" class="bg-slate-50 rounded-2xl overflow-hidden shadow-inner">
    <div id="toast-container"></div>
    <div id="loading-overlay"
        class="fixed inset-0 bg-white/80 z-50 hidden justify-center items-center backdrop-blur-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600"></i>
    </div>

    <div class="flex flex-col md:flex-row min-h-[600px]">
        <!-- Internal Sidebar for Vault -->
        <aside class="w-full md:w-64 bg-white border-r border-slate-200 p-4">
            <div class="mb-6">
                <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">Navigation</h4>
                <nav class="space-y-1" id="vault-nav">
                    <button onclick="vault.navigate('dashboard')"
                        class="vault-nav-item active w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
                        <i class="ph-bold ph-chart-pie text-xl w-5"></i> Dashboard
                    </button>
                    <!-- Add more nav items as needed -->
                </nav>
            </div>
            <div class="mt-auto pt-4 border-t">
                <button onclick="vault.refreshData(true)"
                    class="w-full bg-slate-100 hover:bg-slate-200 py-2 rounded-lg text-slate-600 text-sm font-medium">
                    <i class="fa-solid fa-arrows-rotate mr-2"></i>Sync Records
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 md:p-8">
            <div id="vault-content" class="max-w-5xl mx-auto">
                <!-- Content will be injected here -->
            </div>
        </main>
    </div>
</div>

<!-- Modal -->
<div id="add-modal"
    class="fixed inset-0 bg-slate-900/40 hidden items-center justify-center z-[9999] backdrop-blur-sm transition-all duration-300 opacity-0"
    onclick="if(event.target===this) vault.hideModal()">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl transform scale-95 transition-all duration-300">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h3 class="text-xl font-bold text-slate-800">New Record</h3>
                <p class="text-sm text-slate-500">Enter the details for the new entry</p>
            </div>
            <button onclick="vault.hideModal()"
                class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"><i
                    class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="event.preventDefault(); vault.saveRecord(this)">
            <div class="space-y-5">
                <div class="group">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Title</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i
                                class="fa-solid fa-heading"></i></span>
                        <input name="TITLE" required placeholder="e.g. Project Alpha Documentation"
                            class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none bg-slate-50/50 hover:bg-white text-slate-800 placeholder:text-slate-400">
                    </div>
                </div>
                <div class="group">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Reference Number</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i
                                class="fa-solid fa-hashtag"></i></span>
                        <input name="REFERENCE_NUMBER" required placeholder="e.g. REF-2024-X99"
                            class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none bg-slate-50/50 hover:bg-white text-slate-800 placeholder:text-slate-400">
                    </div>
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-slate-100">
                <button type="button" onclick="vault.hideModal()"
                    class="px-5 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-xl font-medium transition-colors">Cancel</button>
                <button type="submit"
                    class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 font-medium transition-all transform active:scale-95 flex items-center">
                    Save Record <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_ENDPOINTS = {
        GET: 'http://61.2.142.91:8301/api/records-20260120_192311',
        POST: 'http://61.2.142.91:8301/api/records-20260120_192313',
        DELETE: 'http://61.2.142.91:8301/api/records/:id-20260120_192315'
    };

    class VaultAPI {
        static async fetch() {
            try {
                const r = await fetch(API_ENDPOINTS.GET);
                return await r.json();
            } catch (e) { return { success: false, data: [], error: e.message }; }
        }
        static async create(data) {
            try {
                const r = await fetch(API_ENDPOINTS.POST, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await r.json();
            } catch (e) { return { success: false, error: e.message }; }
        }
        static async delete(id) {
            try {
                const url = API_ENDPOINTS.DELETE.replace(':id', id);
                const r = await fetch(url, { method: 'DELETE' });
                return await r.json();
            } catch (e) { return { success: false, error: e.message }; }
        }
    }

    function showToast(msg, type = 'info') {
        const d = document.createElement('div');
        d.className = `toast ${type}`;
        d.innerHTML = `<i class="ph-fill ${type === 'success' ? 'ph-check-circle text-green-600' : type === 'error' ? 'ph-warning-circle text-red-600' : 'ph-info text-blue-600'} text-xl"></i><span class="text-sm font-medium ml-2">${msg}</span>`;
        document.getElementById('toast-container').appendChild(d);
        requestAnimationFrame(() => d.classList.add('show'));
        setTimeout(() => { d.remove() }, 3300);
    }

    class VaultApp {
        constructor() {
            this.records = [];
        }
        async initialize() {
            await this.loadData();
            this.render();
        }
        async loadData() {
            this.setLoading(true);
            const result = await VaultAPI.fetch();
            if (result.success) {
                this.records = result.data || [];
            } else {
                this.records = [];
                showToast('Failed to load records', 'error');
            }
            this.setLoading(false);
        }
        setLoading(show) {
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        }
        render() {
            document.getElementById('vault-content').innerHTML = this.getTableHTML();
        }
        getTableHTML() {
            const rows = this.records.map(r => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 text-sm text-slate-900 font-medium border-b border-slate-100">${r.ID || ''}</td>
                    <td class="px-6 py-4 text-sm text-slate-600 border-b border-slate-100">${r.TITLE || ''}</td>
                    <td class="px-6 py-4 text-sm text-slate-600 border-b border-slate-100">${r.REFERENCE_NUMBER || ''}</td>
                    <td class="px-6 py-4 text-sm text-slate-600 border-b border-slate-100 text-center">
                        <button onclick="vault.deleteRecord(${r.ID})" class="p-2 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-lg transition-all" title="Delete Record"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`).join('');

            const emptyState = `
                <tr>
                    <td colspan="4" class="px-6 py-12 text-center text-slate-400">
                        <i class="ph-duotone ph-folder-open text-5xl mb-4 block"></i>
                        No records found. Click "New Record" to add one.
                    </td>
                </tr>`;

            return `
                <div class="space-y-6 fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 class="text-2xl font-bold text-slate-800">Records</h3>
                            <p class="text-slate-500 text-sm mt-1">Manage and access your reference record vault</p>
                        </div>
                        <button onclick="vault.showAddModal()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 flex items-center font-bold">
                            <i class="fa-solid fa-plus mr-2"></i>New Record
                        </button>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full">
                                <thead class="bg-slate-50/50">
                                    <tr>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">ID</th>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Title</th>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Reference Number</th>
                                        <th class="px-6 py-4 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 bg-white">
                                    ${this.records.length ? rows : emptyState}
                                </tbody>
                            </table>
                        </div>
                        <div class="px-6 py-4 border-t border-slate-50 bg-slate-50/30 text-xs text-slate-400 text-center">
                            Showing ${this.records.length} records
                        </div>
                    </div>
                </div>`;
        }
        showAddModal() {
            const m = document.getElementById('add-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
            setTimeout(() => {
                m.classList.remove('opacity-0');
                m.querySelector('div').classList.replace('scale-95', 'scale-100');
            }, 10);
        }
        hideModal() {
            const m = document.getElementById('add-modal');
            m.classList.add('opacity-0');
            m.querySelector('div').classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                m.classList.add('hidden');
                m.classList.remove('flex');
            }, 300);
        }
        async saveRecord(form) {
            const data = Object.fromEntries(new FormData(form).entries());
            this.setLoading(true);
            const res = await VaultAPI.create(data);
            this.setLoading(false);
            if (res.success) {
                showToast('Record created successfully', 'success');
                this.hideModal();
                form.reset();
                await this.loadData();
                this.render();
            } else {
                showToast('Error: ' + (res.error || 'Unknown failure'), 'error');
            }
        }
        async deleteRecord(id) {
            if (!confirm('Permanently delete this record?')) return;
            this.setLoading(true);
            const res = await VaultAPI.delete(id);
            this.setLoading(false);
            if (res.success || res.message === 'Record deleted successfully') {
                showToast('Record deleted', 'success');
                await this.loadData();
                this.render();
            } else {
                showToast('Failed to delete', 'error');
            }
        }
        navigate(v) {
            this.render(); // Simple for now
        }
        async refreshData(t = false) {
            await this.loadData();
            this.render();
            if (t) showToast('Data synchronized', 'success');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.vault = new VaultApp();
        window.vault.initialize();
    });
</script>
{% endblock %}
