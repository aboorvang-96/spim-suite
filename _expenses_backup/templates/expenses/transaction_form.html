{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ title }}</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field.errors }}
                        <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}"
                            id="{{ field.id_for_label }}" class="form-control" value="{{ field.value|default:'' }}" {%
                            if field.field.required %}required{% endif %}>
                        {% if field.help_text %}
                        <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-link w-100 text-center mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
